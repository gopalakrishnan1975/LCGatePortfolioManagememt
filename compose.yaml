services:
  master:
    build: .
    command: uvicorn services.master:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]
    volumes: ["./master_data:/app/master_data:ro"]
  simulation:
    build: .
    command: uvicorn services.simulation:app --host 0.0.0.0 --port 8002
    ports: ["8002:8002"]
  appraisal:
    build: .
    command: uvicorn services.appraisal:app --host 0.0.0.0 --port 8003
    ports: ["8003:8003"]
    environment:
      SIM_URL: http://simulation:8002
    depends_on: [simulation]
  portfolio:
    build: .
    command: uvicorn services.portfolio:app --host 0.0.0.0 --port 8004
    ports: ["8004:8004"]
  ui:
    build: .
    ports: ["8501:8501"]
    environment:
      SERVICE_MODE: remote
      MASTER_URL: http://master:8001
      APPRAISAL_URL: http://appraisal:8003
      PORTFOLIO_URL: http://portfolio:8004
    depends_on: [master, appraisal, portfolio]
